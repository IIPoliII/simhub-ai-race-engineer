# Every day: does the published plugin still load in the latest SimHub, and does the source still compile against it?
# If not, an issue is opened (once per SimHub version), before users hit the problem.
# The check runs read-only (it installs SimHub); only the "report" job can open the issue.
name: SimHub compatibility

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      simhub_version:
        description: SimHub version to check (empty = the latest)
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    outputs:
      simhub: ${{ steps.simhub.outputs.version }}
      prepared: ${{ steps.simhub.outcome }}
      tag: ${{ steps.published.outputs.tag }}
      published: ${{ steps.published.outcome }}
      source: ${{ steps.source.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Latest published plugin, fetched before SimHub's installer runs
      - name: Download the published plugin
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view -R $env:GITHUB_REPOSITORY --json tagName -q .tagName
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release download $tag -R $env:GITHUB_REPOSITORY -p AIRaceEngineer.dll -D published --clobber

      - id: simhub
        uses: ./.github/actions/simhub
        with:
          version: ${{ inputs.simhub_version }}

      # NuGet restore and CompatCheck build, outside the checks: a network or NuGet outage fails the run here
      # instead of being reported as "SimHub breaks the plugin"
      - name: Prepare the tools
        shell: pwsh
        run: |
          dotnet build tools/CompatCheck -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore plugin/AIRaceEngineer.csproj "-p:SimHubDir=$PWD/simhub-ref"
          exit $LASTEXITCODE

      - name: Published plugin still loads
        id: published
        continue-on-error: true
        shell: pwsh
        run: |
          "tag=${{ steps.release.outputs.tag }}" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force report | Out-Null
          dotnet run --project tools/CompatCheck -c Release --no-build -- published/AIRaceEngineer.dll simhub-ref *>&1 | Tee-Object report/published.txt
          exit $LASTEXITCODE

      - name: Source still compiles
        id: source
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force report | Out-Null
          dotnet build plugin/AIRaceEngineer.csproj -c Release --no-restore "-p:SimHubDir=$PWD/simhub-ref" *>&1 | Tee-Object report/source.txt
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v7
        if: steps.published.outcome == 'failure' || steps.source.outcome == 'failure'
        with:
          name: report
          path: report

  report:
    needs: check
    # also when SimHub itself could not be prepared (e.g. a DLL the plugin needs is gone), not for other failures
    if: >-
      always() && needs.check.result != 'cancelled' &&
      (needs.check.outputs.prepared == 'failure' || needs.check.outputs.published == 'failure' || needs.check.outputs.source == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        if: needs.check.outputs.published == 'failure' || needs.check.outputs.source == 'failure'
        with:
          name: report
          path: report

      - name: Open an issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIMHUB: ${{ needs.check.outputs.simhub }}
          TAG: ${{ needs.check.outputs.tag }}
          PUBLISHED: ${{ needs.check.outputs.published }}
          SOURCE: ${{ needs.check.outputs.source }}
        run: |
          $title = "SimHub $env:SIMHUB breaks the plugin"
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $fence = '```'
          $body = "SimHub **$env:SIMHUB** ([release](https://github.com/SHWotever/SimHub/releases/tag/$env:SIMHUB)), checked by [this run]($run).`n`n"
          if ($env:PUBLISHED -ne "failure" -and $env:SOURCE -ne "failure") {
            $title = "SimHub $env:SIMHUB`: the compatibility check could not run"
            $body += "SimHub could not be downloaded or installed, or a DLL the plugin needs is missing from it, so the plugin could not be checked. The run's log has the details.`n"
          }
          if ($env:PUBLISHED -eq "failure") {
            $body += "### The published plugin ($env:TAG) does not load`n`n$fence`n" + ((Get-Content report/published.txt -ErrorAction SilentlyContinue) -join "`n") + "`n$fence`n`n"
          }
          if ($env:SOURCE -eq "failure") {
            $errors = Select-String -Path report/source.txt -Pattern ': error ' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 30
            $body += "### The source does not compile`n`n$fence`n" + ($errors -join "`n") + "`n$fence`n"
          }
          $existing = gh issue list -R $env:GITHUB_REPOSITORY --state open --search "`"$title`" in:title" --json number -q '.[0].number'
          if ($existing) { Write-Host "Issue #$existing is already open." }
          else { $body | Set-Content issue.md; gh issue create -R $env:GITHUB_REPOSITORY --title $title --body-file issue.md }
          exit 1
