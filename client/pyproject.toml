[project]
name = "ai-race-engineer"
version = "0.6.2"   # = version du plugin (plugin/AIRaceEngineer.csproj) ; après un changement : uv lock
description = "AI Race Engineer: voice client for SimHub (all games) / client vocal pour SimHub (tous les jeux)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1",   # reconnaissance vocale locale (gratuit)
    "kokoro-onnx>=0.6.1",    # voix locale (gratuit, hors ligne) ; Kokoro.from_session pour régler les fils
    "edge-tts>=7.0",         # voix neuronales Microsoft (gratuit, en ligne)
    "soundfile>=0.12",       # décodage MP3 des voix en ligne
    "openai>=1.40",          # client compatible Infomaniak / OpenAI / Claude / Ollama
    "httpx>=0.27",
    "numpy>=1.26",
    "sounddevice>=0.5",      # micro + haut-parleurs
]

[tool.uv]
package = false
